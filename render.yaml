services:
  - type: web
    name: gamegold-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB
        value: gamegold
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_MODEL
        value: anthropic/claude-haiku-4-5
      - key: LLM_API_KEY
        sync: false # Anthropic key (sk-ant-...) — set in the Render dashboard
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: '["https://gamegold.vercel.app"]'
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: DEBUG
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://gamegold.vercel.app # OAuth redirects land here; must match CORS_ORIGINS
      - key: API_PUBLIC_URL
        sync: false # MUST be this Render service's public URL (e.g. https://gamegold-api.onrender.com) — OAuth redirect_uri is built from it
